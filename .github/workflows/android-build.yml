name: Android Build

# 2026-10-28：補助案查核點 B1（115/12 到期）——Munea 第一次有 Android 版。
# 卡西法這台 Windows 沒裝 Java／Android SDK（Edward 還沒同意裝），所以整條建置鏈
# 全部搬上雲端：npm 裝 @capacitor/android → cap sync 把 web/ 複製進 android/app/src/
# main/assets/public（.gitignore 已排除、不進版控）→ ubuntu-latest 跑 Gradle 組 APK。
# 第一階段只簽 debug（不碰正式簽章／Play 上架）；第二階段在真的 Android 模擬器裝上
# 去開機，證明「APK 裝得上、首頁畫得出來」，不是只有編譯綠燈。
#
# 2026-10-28 補第三階段：B1 真正要的「登入、聊聊通話 2 項流程可操作」。借 iOS 既有的
# 「直連測試包」做法（scripts/enable-ios-development-profile.mjs，本來就吃任意目標路徑）
# 幫 Android 也點一份同款設定：App 啟動後本機合成一個假登入 session（不呼叫真
# Supabase、不需要任何密碼或金鑰），語音／文字 API 指向 staging（不是正式機）。
# 這支 APK 只用在這條自動化流程裡，跟第一階段那支「乾淨、沒開發包」的 APK 是分開的。

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/b1-android-*"
  pull_request:
    paths:
      - "android/**"
      - "web/**"
      - "scripts/android-ui-tap-by-text.py"
      - "scripts/android-launcher-icon-check.py"
      - "scripts/android-flow-smoke.sh"
      - "scripts/enable-ios-development-profile.mjs"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-build.yml"

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 建置 Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # android/ 的 build.gradle 由 @capacitor/android 8.5.3 範本產生：
      # AGP 8.13.0、Gradle 8.14.3、compileSdk/targetSdk 36。這組合要 JDK 21。
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 2026-10-28 試過 android-actions/setup-android@v3，它會嘗試裝已經從
      # SDK repository 下架的舊版 `tools` 套件、直接噴錯退出（第一次 push 就
      # 紅在這步）。ubuntu-latest runner 本身已經內建 Android SDK（cmdline-tools、
      # platform-tools、常見 platforms/build-tools）且 licenses 已預先接受，
      # 不需要另外裝——缺的 compileSdk 36 元件讓 AGP 在建置時自己用內建
      # sdkmanager 補（sdkAutoDownload 預設開、runner 有網路）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 只做這一步：把 web/ 的網頁素材複製進 android/app/src/main/assets/public，
      # 不需要 Java 也不需要 SDK（本機這台 Windows 一樣能跑這行，驗過了）。
      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: munea-android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: 模擬器開機截圖（證明 APK 裝得上、首頁畫得出來）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: munea-android-debug-${{ github.run_number }}
          path: ./apk-download

      # reactivecircus/android-emulator-runner 需要 KVM 硬體加速才跑得動；
      # GitHub 的 ubuntu-latest runner 有開 nested virtualization，這裡把 kvm
      # 裝置的權限打開給一般使用者用（官方 action README 的標準作法）。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 2026-10-29（PR #632 換官方圖示後補的證據）：桌面圖示驗證小工具用 Pillow 裁圖、算顏色，
      # runner 的 python3 沒內建 Pillow，先裝。
      - name: Install Pillow (launcher icon check)
        run: python3 -m pip install --quiet pillow

      - name: Launch emulator, install APK, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # 2026-10-28（PR #630 原生啟動畫面）：多拍 2 秒跟 20 秒各一張——2 秒那張 WebView 一定
          # 還沒畫好、看到的就是原生啟動畫面本人（奶油底＋沐寧標誌，不是白屏）；20 秒那張是
          # 網頁殼接手之後的畫面；8 秒那張沿用原檔名。模擬器桌面程式冷開機會自己「沒有回應」、
          # 對話框蓋在畫面上，拍 8 秒那張之前先把別人的對話框關掉（工具只關別人的、不關 App 自己的）。
          script: |
            adb install -r ./apk-download/app-debug.apk
            adb shell monkey -p net.munea.app -c android.intent.category.LAUNCHER 1
            sleep 2
            adb exec-out screencap -p > launch-2s.png
            python3 scripts/android-ui-tap-by-text.py --dismiss-anr-only --dump-path launch-8s-pre-shot.xml || true
            sleep 5
            adb exec-out screencap -p > launch.png
            sleep 12
            adb exec-out screencap -p > launch-20s.png
            # 2026-10-29：按 HOME、打開應用程式列表，拍桌面上的 Munea 圖示——#632 把範本藍 X 換成
            # 官方圖示後，這是第一次有人在模擬器上親眼看那顆。找不到「Munea」那格、或那格的顏色
            # 不是橘水滴＋青綠漣漪（例如又變回範本藍），這步就紅；截圖與判定都放 launcher-icon/。
            python3 scripts/android-launcher-icon-check.py --out-dir launcher-icon

      - name: Upload launch screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munea-android-screens-${{ github.run_number }}
          path: |
            launch-2s.png
            launch.png
            launch-20s.png
            launcher-icon/
          if-no-files-found: warn
          retention-days: 14

  flows-smoke:
    name: 登入與聊聊通話流程自動化（B1 查核點）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # 借 iOS 既有的開發包腳本，只改生成出來的 android 資產檔，不動 web/ 的 App
      # 邏輯一行。direct 模式＝本機合成假登入 session，不呼叫真 Supabase、不需要
      # 任何密碼或金鑰；brain/voice 走 staging（asia-east1 Cloud Run），不是正式機。
      - name: Apply direct development test profile (no secrets required)
        run: npm run android:dev-profile:direct

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build dev-profile debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 2026-10-28：把這顆「自動登入、指向測試機」的測試包也留成檔案——真機實驗室
      # （Firebase Test Lab）要拿它在真的安卓手機上走聊聊／通話流程；上面 build job
      # 那顆是正式設定（真帳號登入）給人安裝用，兩顆用途不同、都要留。
      - name: Upload dev-profile APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munea-android-devprofile-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 腳本本身在 scripts/android-flow-smoke.sh（版控內，可離線讀）：
      # 裝 APK → 開 App → 等底部導覽出現（用 uiautomator 找「聊聊」分頁，逾時
      # 40 秒而非固定 sleep 賭運氣）→ 點下去 → 找通話鈕點下去 → 等 5 秒 →
      # 截圖。模擬器沒麥克風，連不上語音是預期內，腳本只如實記錄畫面顯示什麼。
      #
      # 2026-10-28 兩輪真跑才調好：①這個 runner image 的 Android 模擬器預設是
      # 英文 locale，試過用開機 `-prop persist.sys.locale=zh-TW` 釘 locale，
      # 但這版 emulator（37.2.12.0）直接噴警告拒收（「only 'qemu.*' properties
      # are supported」）、prop 沒生效——改成純靠
      # scripts/android-ui-tap-by-text.py 同時給中英文候選字串（已驗證有效）。
      # ②通話鈕用 `aria-label` 當無障礙名稱（唸給螢幕報讀器聽的），Chrome 的
      # accessibility bridge 把這個 aria-label 暴露成 uiautomator 看到的 text，
      # 不是按鈕內 <span> 的可見字——「開始通話」這個候選永遠不會命中，真正
      # 該找的是 aria-label 本身「開始或結束通話」（已用真實 CI 跑出來的
      # accessibility tree dump 驗證過這個比對邏輯）。
      - name: Run login + chat flow automation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-flow-smoke.sh

      - name: Upload flow screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munea-android-flows-${{ github.run_number }}
          path: flows-shots/
          if-no-files-found: warn
          retention-days: 14
