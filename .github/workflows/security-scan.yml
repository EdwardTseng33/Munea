# 弱點掃描：每次改程式都掃一次、每月再掃一次（補助案 D1 承諾：部署時套件與映像檔弱點掃描＋每月掃描＋修補分級）
#
# 為什麼要有這支（2026-10-13）：
#   D1 第一次人工掃描就抓到 Capacitor 殼一個嚴重級（GHSA-rvm3-566m-v7fv：遠端內容可經
#   內部代理路徑以 App 來源載入）、三個高風險、蘋果函式庫一個——而且已經在正式版裡待了
#   一陣子沒人發現。靠人記得掃是不行的，要讓它自己跑。
#
# 修補分級（8/12 審查簡報承諾）：critical／high 當輪必修、moderate 兩週內、low 併下次例行。
# critical／high 直接讓這支紅掉，擋在合併前。
name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 1 * *"   # 每月 1 日 02:00 UTC（台灣 10:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    # 2026-11-18（補助案 D4 企業資安評級前測改善第 1 項「對外公開資訊要先審」）：
    #   這個程式庫是公開的，任何人都看得到每一次上傳。鑰匙、密碼一旦夾帶上來，刪掉也還留在歷史裡。
    #   所以每次改程式都掃「這次新增的內容」，掃到就擋在合併前；每月例行再把整份目前的檔案掃一遍留檔。
    #   每月那次先只留報告不擋（舊檔裡有公開用的前端金鑰，要先逐筆確認、列進白名單後才改成擋）。
    name: 鑰匙外洩（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 安裝 gitleaks（固定版本＋核對雜湊）
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$tarball" -o "$RUNNER_TEMP/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: 掃這次新增的內容（掃到就擋）
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          RANGE_PR: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          RANGE_PUSH: ${{ github.event.before }}..${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then range="$RANGE_PR"; else range="$RANGE_PUSH"; fi
          # 新分支第一次上傳時 before 是一串 0，改成只掃最新那一筆
          case "$range" in 0000000000000000000000000000000000000000..*) range="${{ github.sha }}~1..${{ github.sha }}";; esac
          echo "掃描範圍：$range"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --no-banner --report-format sarif --report-path gitleaks-diff.sarif --exit-code 1 .
      - name: 每月例行：整份目前的檔案掃一遍（只留報告）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --report-format json --report-path gitleaks-tree.json --exit-code 0
          python3 -c "import json;d=json.load(open('gitleaks-tree.json'));print('整份檔案掃描：', len(d), '筆待確認')"
      - name: 留下掃描報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ github.run_id }}
          path: |
            gitleaks-diff.sarif
            gitleaks-tree.json
          if-no-files-found: ignore
          retention-days: 90

  dependencies:
    name: 套件弱點（npm ＋ Python）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: npm audit（critical／high 擋下）
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit 全量報告（含開發套件，留檔）
        if: always()
        run: npm audit --json > npm-audit.json || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit（engine/requirements.txt）
        run: |
          python -m pip install -q pip-audit
          python -m pip_audit -r engine/requirements.txt --strict -f json -o pip-audit.json
      - name: 留下掃描報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            npm-audit.json
            pip-audit.json
          retention-days: 400

  image:
    name: 映像檔與設定（Trivy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 檔案系統掃描（鎖定檔、已知漏洞）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      # 掃全部 Dockerfile（根目錄、Cloud Run 引擎、總機、顯示卡管家）。
      # 唯一跳過：RunPod 爆量備援顯示卡印象檔 Dockerfile.vocaframe——整套引擎、權重、維修用 sshd
      # 都裝在 /root，啟動要 root 才能起 sshd 與綁 GPU；那張卡不直接對外、只收總機帶通話令牌的
      # 連線。改成非 root 要重做印象檔並在實卡重驗（開卡一次 9 分鐘），排入 D2 資安檢測修補期
      # （116 年 1–2 月）一併做；在那之前這條是「已知、已登記、接受」的風險，不是沒看到。
      - name: Dockerfile 設定掃描（全部，跳過 GPU 印象檔）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-files: deploy/runpod-avatar/gpu-image/Dockerfile.vocaframe
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
      - name: 建 Cloud Run 映像並掃描（跟正式部署同一份 Dockerfile）
        run: docker build -f deploy/cloudrun/Dockerfile -t munea-cloudrun:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: munea-cloudrun:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
