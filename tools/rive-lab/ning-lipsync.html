<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寧寧動起來 · 三軸轉頭 v6</title>
<style>
  :root { --teal:#3AA8A0; --cream:#FAF7F2; --ink:#33403D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Noto Sans TC",-apple-system,sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:18px 16px 40px; }
  h1 { font-size:19px; font-weight:700; margin:6px 0 2px; }
  .sub { font-size:12.5px; color:#6b7a76; margin-bottom:12px; text-align:center; }
  .phone { width:min(46vh,340px); aspect-ratio:9/19; background:#F6EFE3; border-radius:34px; border:10px solid #2e2e30; overflow:hidden; position:relative; box-shadow:0 8px 30px rgba(51,64,61,.18); }
  .artwrap { position:absolute; left:50%; top:-13.2%; width:163%; transform:translateX(-50%); aspect-ratio:853/1844; }
  .artwrap img.layer { position:absolute; inset:0; width:100%; height:100%; }
  #headg { position:absolute; inset:0; will-change:transform; }
  #faceg { position:absolute; inset:0; will-change:transform; }
  #headcv { position:absolute; }
  #headg img.part { position:absolute; pointer-events:none; }
  img.eyestate { left:38.1%; top:25.98%; width:27.55%; height:4.93%; }
  img.mouthpatch { left:42.79%; top:31.72%; width:19.34%; height:6.34%; opacity:0; transform-origin:50% 30%; }
  .meters { display:flex; gap:16px; justify-content:center; margin-top:10px; font-size:12.5px; color:#6b7a76; }
  .meters b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-size:15px; padding:10px 18px; border-radius:999px; border:1.5px solid #d8d2c4; background:#fff; color:var(--ink); cursor:pointer; }
  button.on { background:var(--teal); border-color:var(--teal); color:#fff; }
  .note { max-width:440px; margin-top:14px; font-size:12.5px; line-height:1.7; color:#8a948f; text-align:center; }
</style>
</head>
<body>
  <h1>寧寧 · 本地對嘴驗證</h1>
  <div class="sub">嘴巴直接聽聲音動——不繞雲端顯示卡。對著麥克風講話，或放一段她的錄音。</div>
  <div style="margin:14px auto 18px;max-width:560px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center">
    <button id="lsMic" style="padding:9px 16px;border-radius:9px;border:1px solid #3AA8A0;background:#3AA8A0;color:#fff;font-size:15px;cursor:pointer">用麥克風講講看</button>
    <label style="padding:9px 16px;border-radius:9px;border:1px solid #999;cursor:pointer;font-size:15px">放一段錄音
      <input type="file" id="lsFile" accept="audio/*" style="display:none">
    </label>
    <button id="lsStop" style="padding:9px 16px;border-radius:9px;border:1px solid #999;background:#fff;font-size:15px;cursor:pointer">停</button>
  </div>
  <div style="margin:0 auto 16px;max-width:560px;font-size:14px;color:#555;text-align:center">
    <div>狀態：<span id="lsState">還沒開始</span>　｜　現在的口型：<b id="lsShape">—</b></div>
    <div style="height:8px;background:#eee;border-radius:4px;margin:8px auto 0;max-width:320px;overflow:hidden">
      <div id="lsLevel" style="height:100%;width:0%;background:#3AA8A0;transition:width .05s linear"></div>
    </div>
    <div style="margin-top:6px;font-size:12px;color:#888">上面那條是即時音量，口型由聲音的高低頻分布挑</div>
  </div>
  <audio id="lsAudio" style="display:none"></audio>
  <div class="phone">
    <div class="artwrap" id="wrap">
      <img class="layer" id="chestimg" src="ning/p-chest.png" alt="寧寧">
      <img class="layer" id="neckimg" src="ning/p-neck.png" alt="">
      <div id="headg">
        <canvas id="headcv"></canvas>
        <div id="faceg">
          <img class="part eyestate" id="p-eyes-closed" src="ning/part-eyes-closed.png" style="opacity:0;" alt="">
          <img class="part mouthpatch" id="f-tiny" src="ning/mouth-tiny.png" alt="">
          <img class="part mouthpatch" id="f-half" src="ning/mouth-half.png" alt="">
          <img class="part mouthpatch" id="f-ahsmall" src="ning/mouth-ahsmall.png" alt="">
          <img class="part mouthpatch" id="f-a" src="ning/mouth-a.png" alt="">
          <img class="part mouthpatch" id="f-e" src="ning/mouth-e.png" alt="">
          <img class="part mouthpatch" id="f-i" src="ning/mouth-i.png" alt="">
          <img class="part mouthpatch" id="f-o" src="ning/mouth-o.png" alt="">
          <img class="part mouthpatch" id="f-u" src="ning/mouth-u.png" alt="">
          <img class="part mouthpatch" id="v-smile" src="ning/mouth-smile.png" alt="">
        </div>
      </div>
    </div>
  </div>
  <div class="meters">
    <span>畫面流暢度 <b id="fps">–</b> fps</span>
    <span>狀態 <b id="st">待機</b></span>
  </div>
  <div class="btns">
    <button id="b-idle" class="on">安靜待機</button>
    <button id="b-say">講一句話</button>
    <button id="b-chat">連續聊天</button>
    <button id="b-happy">開心</button>
  </div>
  <p class="note">v6 依照參考影片重寫：真人待機時大部分是靜止的，每 2–4 秒才來一個「拍子」（點一下頭、歪一下、看一下旁邊），而且是快下慢回。頭用左右轉／點頭／歪頭三個角度驅動，臉在頭上會跟著挪位、遠的那半邊會收窄——所以是轉、不是整塊滑過去。</p>

<script>
/* ========= 頭層網格：臉剛體＋轉頭視差，髮梢流動 ========= */
var HeadMesh = (function(){
  var TEX = { left:6.0961, top:8.8937, w:82.6495, h:39.5879 };   // p-head-crop.png 在原畫中的位置
  var ART_W = 853, MARGIN = 60;
  var cv = document.getElementById('headcv');
  var gl = cv.getContext('webgl', { premultipliedAlpha:true, alpha:true });

  var VS = [
  'attribute vec2 aPos; attribute vec2 aUV;',
  'uniform vec2 uRes; uniform float uS1,uS2,uS3,uRip,uWind,uMargin,uLift,uYaw,uPitch;',
  'varying vec2 vUV;',
  'void main(){',
  '  float u = aUV.x, v = aUV.y;',
  '  float d = length(vec2((u-0.536)/0.213, (v-0.489)/0.275));',
  // 臉在頭上的位移視差：轉頭時五官往轉的方向掃過去，頭殼幾乎不動 → 看起來是「轉」
  '  float faceW = 1.0 - smoothstep(0.15, 1.30, d);',
  '  float px = uYaw * faceW * 13.0;',
  '  float py = uPitch * faceW * 19.0;',
  // 頭髮：離臉越遠越自由，髮根與靠肩的髮尾釘住
  '  float free = smoothstep(1.02, 1.95, d);',
  '  free *= smoothstep(0.08, 0.42, v);',
  '  free *= 1.0 - 0.88*smoothstep(0.62, 0.95, v);',
  '  float w2 = free*free*(1.0+0.7*free);',
  '  float sA = sin(u*5.3+0.4), sB = sin(u*8.7+2.1), sC = sin(u*3.1+4.3);',
  '  float off = w2*( uS1*(0.55+0.45*sA) + uS2*(0.35+0.35*sB) + uS3*(0.30+0.30*sC) );',
  '  off += w2*( sin(v*6.0+u*4.0-uRip)*0.55 + sin(v*10.0+u*7.0-uRip*1.6)*0.30 )*uWind;',
  '  float dy = abs(off)*0.18*w2 + w2*cos(u*4.0-uRip*0.7)*uWind*0.35',
  '           - uLift*smoothstep(0.35,0.95,v)*free;',
  '  vec2 p = vec2(aPos.x + uMargin + off + px, aPos.y + dy + py);',
  '  vec2 clip = (p/uRes)*2.0 - 1.0;',
  '  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0); vUV = aUV;',
  '}'].join('\n');
  var FS = 'precision mediump float; varying vec2 vUV; uniform sampler2D uTex;'
         + 'void main(){ gl_FragColor = texture2D(uTex, vUV); }';

  function sh(t,s){ var o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  var L = {};
  ['aPos','aUV'].forEach(function(k){ L[k]=gl.getAttribLocation(prog,k); });
  ['uRes','uS1','uS2','uS3','uRip','uWind','uMargin','uTex','uLift','uYaw','uPitch']
    .forEach(function(k){ L[k]=gl.getUniformLocation(prog,k); });
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

  var COLS=48, ROWS=64, vb=gl.createBuffer(), ib=gl.createBuffer(), n=0;
  function grid(w,h){
    var V=[],I=[];
    for(var r=0;r<=ROWS;r++) for(var c=0;c<=COLS;c++) V.push(w*c/COLS, h*r/ROWS, c/COLS, r/ROWS);
    for(var r2=0;r2<ROWS;r2++) for(var c2=0;c2<COLS;c2++){
      var i0=r2*(COLS+1)+c2, i1=i0+1, i2=i0+COLS+1, i3=i2+1; I.push(i0,i2,i1, i1,i2,i3);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(V),gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(I),gl.STATIC_DRAW);
    n=I.length;
  }

  var tex=null, img=new Image(), ready=false;
  img.onload=function(){
    cv.width = img.width + MARGIN*2; cv.height = img.height;
    var mpct = MARGIN/ART_W*100;
    cv.style.left = (TEX.left - mpct) + '%';
    cv.style.top  = TEX.top + '%';
    cv.style.width  = (TEX.w + mpct*2) + '%';
    cv.style.height = TEX.h + '%';
    gl.viewport(0,0,cv.width,cv.height);
    grid(img.width, img.height);
    tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    ready=true;
  };
  img.src='ning/p-head-crop.png';

  var S=[{k:26,c:5.4,a:1.00,x:0,v:0},{k:16,c:4.0,a:0.62,x:0,v:0},{k:38,c:6.6,a:0.42,x:0,v:0}];
  var rip=0;
  function step(dt, drive, wind, lift, yaw, pitch){
    if(!ready) return;
    rip += dt*2.1;
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindBuffer(gl.ARRAY_BUFFER,vb);
    gl.enableVertexAttribArray(L.aPos); gl.vertexAttribPointer(L.aPos,2,gl.FLOAT,false,16,0);
    gl.enableVertexAttribArray(L.aUV);  gl.vertexAttribPointer(L.aUV,2,gl.FLOAT,false,16,8);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
    gl.uniform2f(L.uRes, cv.width, cv.height);
    gl.uniform1f(L.uMargin, MARGIN);
    gl.uniform1f(L.uRip, rip);
    gl.uniform1f(L.uWind, wind);
    gl.uniform1f(L.uLift, lift);
    gl.uniform1f(L.uYaw, yaw);
    gl.uniform1f(L.uPitch, pitch);
    for(var i=0;i<3;i++){ var s=S[i]; s.v += (s.k*(drive*s.a - s.x) - s.c*s.v)*dt; s.x += s.v*dt; }
    gl.uniform1f(L.uS1,S[0].x); gl.uniform1f(L.uS2,S[1].x); gl.uniform1f(L.uS3,S[2].x);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.drawElements(gl.TRIANGLES,n,gl.UNSIGNED_SHORT,0);
  }
  return { step:step };
})();

(function(){
  var stEl=document.getElementById('st');
  var mode='idle', sayTimer=null;
  var ap=0, apV=0, apTgt=0, peak='f-a';
  var BANK=['f-tiny','f-half','f-ahsmall','f-a','f-e','f-i','f-o','f-u'];
  function setOp(id,v){ document.getElementById(id).style.opacity=Math.max(0,Math.min(1,v)); }
  function sm(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function pm(){ return Math.random()<0.5 ? -1 : 1; }

  /* ---- 三個角度：左右轉(yaw) / 點頭(pitch, 正=低頭) / 歪頭(roll) ---- */
  var A = { yaw:0, yv:0, pitch:0, pv:0, roll:0, rv:0 };
  var T = { yaw:0, pitch:0, roll:0 };
  var tms=0, tNext=1200, tClear=0;

  /* 參考影片量到的節奏：待機 2–4 秒一個拍子、講話 0.7–2 秒一個；其餘時間幾乎靜止 */
  function fireBeat(){
    var talking = (mode==='say' || mode==='chat' || mode==='happy');
    var r=Math.random(), hold;
    if(talking){
      if(r<0.46){                      // 講到重音，點一下頭
        T.pitch=rnd(0.28,0.62); T.yaw=rnd(-0.18,0.18); T.roll=rnd(-0.22,0.22); hold=rnd(220,420);
      } else if(r<0.78){               // 稍微轉頭看人
        T.yaw=pm()*rnd(0.24,0.55); T.roll=T.yaw*rnd(0.3,0.6); T.pitch=rnd(-0.14,0.16); hold=rnd(380,760);
      } else {                          // 歪頭
        T.roll=pm()*rnd(0.28,0.60); T.yaw=T.roll*rnd(0.2,0.45); T.pitch=rnd(0,0.18); hold=rnd(460,900);
      }
      tNext = tms + hold + rnd(180,760);
    } else {
      if(r<0.44){                      // 待機：一個明顯的點頭（快下慢回）
        T.pitch=rnd(0.32,0.62); T.roll=rnd(-0.16,0.16); T.yaw=rnd(-0.14,0.14); hold=rnd(260,460);
      } else if(r<0.78){               // 看一下旁邊
        T.yaw=pm()*rnd(0.26,0.52); T.roll=T.yaw*rnd(0.25,0.5); T.pitch=rnd(-0.06,0.14); hold=rnd(650,1250);
      } else {                          // 歪頭發呆
        T.roll=pm()*rnd(0.26,0.52); T.yaw=T.roll*rnd(0.15,0.4); T.pitch=rnd(0,0.14); hold=rnd(800,1500);
      }
      tNext = tms + hold + rnd(1400,3000);
    }
    tClear = tms + hold;
  }

  /* 快去慢回：往目標走比較硬，回原位比較軟——真人點頭就是這個手感 */
  function ax(cur, vel, tgt, dt){
    var k = (Math.abs(tgt) > Math.abs(cur)) ? 52 : 19;
    var c = 2*Math.sqrt(k)*0.92;
    vel += (k*(tgt-cur) - c*vel)*dt;
    return [cur+vel*dt, vel];
  }

  var nYaw=0,nYv=0, nPit=0,nPv=0, nRol=0,nRv=0;     // 脖子（跟頭、慢一拍、幅度小）
  var hairPrev=0;
  var last=performance.now();

  (function loop(now){
    now = now || performance.now();
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    var t=now/1000; tms += dt*1000;

    /* 嘴 */
    apV += (210*(apTgt-ap) - 23*apV)*dt; ap += apV*dt; if(ap<0){ap=0;apV=0;}
    var a=Math.min(1,ap);
    BANK.forEach(function(id){ setOp(id,0); });
    if(a>0.06) setOp('f-tiny', sm((a-0.06)/0.08));
    if(a>0.44) setOp('f-half', sm((a-0.44)/0.08));
    if(a>0.76) setOp(peak,      sm((a-0.76)/0.08));

    /* 拍子排程 */
    if(tms > tClear){ T.yaw=0; T.pitch=0; T.roll=0; }
    if(tms > tNext) fireBeat();
    var o;
    o=ax(A.yaw,  A.yv, T.yaw,  dt); A.yaw=o[0];  A.yv=o[1];
    o=ax(A.pitch,A.pv, T.pitch,dt); A.pitch=o[0];A.pv=o[1];
    o=ax(A.roll, A.rv, T.roll, dt); A.roll=o[0]; A.rv=o[1];

    /* 呼吸（唯一持續的動作） */
    var breathe=(Math.sin(t*2*Math.PI/3.6)+1)/2;

    /* 1) 胸：呼吸為主，轉頭時極輕微跟一點 */
    var chestY = -breathe*0.10;
    var chestRot = A.yaw*0.14;
    var ci=document.getElementById('chestimg');
    ci.style.transformOrigin='50% 100%';
    ci.style.transform='translate('+(A.yaw*0.05)+'%,'+chestY+'%) rotate('+chestRot+'deg)';

    /* 2) 脖：跟著頭轉，但慢一拍、幅度約四成 */
    o=ax(nYaw,nYv,A.yaw*0.42,dt); nYaw=o[0]; nYv=o[1];
    o=ax(nPit,nPv,A.pitch*0.34,dt); nPit=o[0]; nPv=o[1];
    o=ax(nRol,nRv,A.roll*0.40,dt); nRol=o[0]; nRv=o[1];
    var ni=document.getElementById('neckimg');
    ni.style.transformOrigin='50% 45%';
    ni.style.transform='translate('+(nYaw*0.22)+'%,'+(chestY+nPit*0.30)+'%) rotate('+(chestRot+nRol*1.3)+'deg) scaleY('+(1-nPit*0.030)+')';

    /* 3) 頭：三個角度一起——歪頭＝真旋轉，轉頭＝頭殼小位移＋遠側收窄，點頭＝下沉＋壓扁 */
    var headX = nYaw*0.22 + A.yaw*0.15;
    var headY = chestY + nPit*0.30 + A.pitch*1.22;
    var headRot = chestRot + A.roll*1.7 + A.yaw*0.6;
    var sx = 1 - 0.075*Math.abs(A.yaw);
    var sy = 1 - 0.030*Math.abs(A.pitch);
    var hg=document.getElementById('headg');
    hg.style.transformOrigin=(50 + A.yaw*3)+'% 46%';
    hg.style.transform='translate('+headX+'%,'+headY+'%) rotate('+headRot+'deg) scale('+sx+','+sy+')';

    /* 五官跟著臉在頭上挪的那 30px / 24px（跟網格裡的視差同一個數） */
    var fg=document.getElementById('faceg');
    fg.style.transform='translate('+(A.yaw*13/853*100)+'%,'+(A.pitch*19/1844*100)+'%)';

    /* 4) 髮：吃頭的角速度當衝力，慣性最大 → 頭停了還在晃 */
    var swing = A.yv*0.9 + A.rv*0.5;
    HeadMesh.step(dt, swing*9, 16, breathe*3.4, A.yaw, A.pitch);

    requestAnimationFrame(loop);
  })();

  function speakTgt(){
    if(mode!=='say'&&mode!=='chat'){ apTgt=0; return; }
    var r=Math.random();
    if(r<0.14) apTgt=0.02;
    else if(r<0.72) apTgt=0.3+Math.random()*0.4;
    else { apTgt=0.72+Math.random()*0.28;
      var P=['f-a','f-e','f-i','f-o','f-u','f-ahsmall']; peak=P[Math.floor(Math.random()*P.length)]; }
    sayTimer=setTimeout(speakTgt, 70+Math.random()*120);
  }
  window.__mouth={ set a(v){ apTgt=v; ap=v; apV=0; }, get a(){ return ap; } };
  window.__angles=function(){ return {yaw:A.yaw, pitch:A.pitch, roll:A.roll}; };

  /* ===================================================================
     本地對嘴驗證（2026-08-08）

     為什麼做這個：現在正式線的聲音要先飛到台灣的顯示卡算嘴型再飛回來，
     來回 1～2 秒。那個延遲不只讓人等，還讓手機的回音消除失準
     （業界文件明講：播放延遲超過 2 秒，回音消除品質就受損）——
     於是她自己的聲音被當成使用者插話，把剛要講的話掐掉＝斷字跳針。

     Google 官方確認 Gemini Live 只送聲音和文字、**不給嘴型參數**，
     所以不能等它支援。業界做法是：聲音一到就在本地當場算嘴型。
     這一段就是驗證那個做法在寧寧這張臉上好不好看。

     怎麼算（純訊號處理，不需要模型）：
       · 音量 → 嘴巴張多大
       · 頻譜重心 → 挑哪一個母音口型
         低頻重 = 嘴圓（o／u）；中頻 = 嘴大開（a）；高頻 = 嘴扁（i／e）
     =================================================================== */
  (function localLipSync(){
    var ac=null, an=null, src=null, buf=null, raf=0, running=false;
    var el=function(id){ return document.getElementById(id); };

    // 挑口型：用語音學的共振峰（F1／F2）位置，不是粗略切頻段。
    // F1 高＝嘴開得大；F2 高＝舌頭往前、嘴扁；F2 低＝嘴圓。
    // 這四個角落就是母音四角圖（a／i／u／中間的 e、o）。
    // 第一版用「低中高頻能量佔比」判，五個母音只對兩個（ㄜ 和 ㄛ 都被判成 ㄚ）——
    // 因為 ㄜ 的兩個共振峰剛好都落在同一段裡，佔比看不出差別。
    // 改成找峰值位置後 5/5 全對（scripts/test-viseme-picker.js 釘著）。
    function pickViseme(freq, sampleRate){
      var nyq=sampleRate/2, n=freq.length;
      var lo=Math.ceil(200/nyq*n), hi=Math.floor(3000/nyq*n);
      var f1=0, f1v=-1, i;
      for(i=lo;i<=Math.floor(1000/nyq*n);i++){ if(freq[i]>f1v){ f1v=freq[i]; f1=i/n*nyq; } }
      var f2=0, f2v=-1;
      for(i=Math.ceil(1000/nyq*n);i<=hi;i++){ if(freq[i]>f2v){ f2v=freq[i]; f2=i/n*nyq; } }
      if(f1v<8 && f2v<8) return 'f-ahsmall';
      var open=f1>620, front=f2>1900, round=f2<1100;
      if(open && !front) return 'f-a';
      if(!open && front) return 'f-i';
      if(!open && round) return f1>400 ? 'f-o' : 'f-u';   // 都是圓嘴，再用開口度分
      if(front) return 'f-e';
      if(round) return 'f-o';
      return f1>450 ? 'f-e' : 'f-o';
    }

    function tick(){
      if(!running){ return; }
      an.getByteTimeDomainData(buf);
      // 音量（RMS）→ 嘴巴開合
      var s=0;
      for(var i=0;i<buf.length;i++){ var d=(buf[i]-128)/128; s+=d*d; }
      var rms=Math.sqrt(s/buf.length);
      var level=Math.min(1, rms*7.5);          // 7.5 是人聲音量到滿開的經驗係數
      var gated=level<0.055 ? 0 : level;       // 底噪不要讓嘴一直抖

      var freq=new Uint8Array(an.frequencyBinCount);
      an.getByteFrequencyData(freq);
      if(gated>0.30) peak=pickViseme(freq, ac.sampleRate);

      apTgt=gated;
      el('lsLevel').style.width=Math.round(gated*100)+'%';
      el('lsShape').textContent=gated>0.30 ? peak.replace('f-','') : '—';
      raf=requestAnimationFrame(tick);
    }

    function start(stream, mediaEl){
      stop();
      ac=new (window.AudioContext||window.webkitAudioContext)();
      an=ac.createAnalyser();
      an.fftSize=1024;
      an.smoothingTimeConstant=0.35;   // 太高會遲鈍、太低會抖
      buf=new Uint8Array(an.fftSize);
      src=stream ? ac.createMediaStreamSource(stream) : ac.createMediaElementSource(mediaEl);
      src.connect(an);
      if(mediaEl) an.connect(ac.destination);   // 放音檔時要聽得到
      mode='chat'; clearTimeout(sayTimer);      // 停掉原本的亂數嘴型
      running=true; tick();
      el('lsState').textContent='聽著（嘴巴跟著聲音動）';
    }
    function stop(){
      running=false; cancelAnimationFrame(raf);
      try{ if(ac) ac.close(); }catch(e){}
      ac=null; apTgt=0;
      el('lsState').textContent='停了';
      el('lsLevel').style.width='0%'; el('lsShape').textContent='—';
    }

    window.addEventListener('DOMContentLoaded', function(){
      el('lsMic').addEventListener('click', function(){
        navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}})
          .then(function(st){ start(st, null); })
          .catch(function(e){ el('lsState').textContent='拿不到麥克風：'+e.message; });
      });
      el('lsFile').addEventListener('change', function(ev){
        var f=ev.target.files && ev.target.files[0]; if(!f) return;
        var au=el('lsAudio'); au.src=URL.createObjectURL(f);
        au.play().then(function(){ start(null, au); })
          .catch(function(e){ el('lsState').textContent='播不出來：'+e.message; });
      });
      el('lsStop').addEventListener('click', stop);
    });
  })();

  (function blink(){
    document.getElementById('p-eyes-closed').style.opacity=1;
    setTimeout(function(){ document.getElementById('p-eyes-closed').style.opacity=0; },130);
    setTimeout(blink, 2600+Math.random()*2800);
  })();

  function smile(on){
    document.getElementById('v-smile').style.opacity=on?1:0;
    BANK.forEach(function(id){ document.getElementById(id).style.visibility=on?'hidden':'visible'; });
  }
  function setMode(m){
    mode=m; if(sayTimer){clearTimeout(sayTimer); sayTimer=null;}
    ['b-idle','b-say','b-chat','b-happy'].forEach(function(id){ document.getElementById(id).className=''; });
    if(m==='idle'){ document.getElementById('b-idle').className='on'; apTgt=0; smile(false); stEl.textContent='待機'; }
  }
  document.getElementById('b-idle').onclick=function(){ setMode('idle'); };
  document.getElementById('b-say').onclick=function(){
    setMode('say'); document.getElementById('b-say').className='on'; stEl.textContent='講話中'; speakTgt();
    setTimeout(function(){ if(mode==='say') setMode('idle'); }, 2800+Math.random()*1400); };
  document.getElementById('b-chat').onclick=function(){
    setMode('chat'); document.getElementById('b-chat').className='on'; stEl.textContent='連續聊天中'; speakTgt(); };
  document.getElementById('b-happy').onclick=function(){
    setMode('happy'); document.getElementById('b-happy').className='on'; stEl.textContent='開心';
    apTgt=0; smile(true); setTimeout(function(){ if(mode==='happy') setMode('idle'); },2200); };

  var fr=0,t0=performance.now();
  (function tick(){ fr++; var n=performance.now();
    if(n-t0>=1000){ document.getElementById('fps').textContent=Math.round(fr*1000/(n-t0)); fr=0; t0=n; }
    requestAnimationFrame(tick); })();
})();
</script>
</body>
</html>
