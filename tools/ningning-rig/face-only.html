<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>寧寧 face-only render</title>
<style>
  /* 跟 App styles.css 的 .flat-face / .ff-* 同一套規則，只是沒有聊聊頁的其他東西 */
  html, body { margin: 0; height: 100%; background: #BADDD6; overflow: hidden; }
  #host { position: relative; width: 100vw; height: 100vh; }
  .flat-face { position: absolute; inset: 0; background: #BADDD6; overflow: hidden; pointer-events: none; }
  .ff-stage { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1536 / 2752; }
  .ff-part { position: absolute; inset: 0; will-change: transform; }
  .ff-body { transform-origin: 50% 100%; }
  .ff-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .ff-half, .ff-open, .ff-eyes { visibility: hidden; }
</style>
</head>
<body>
<div id="host"></div>
<script src="../src/companion-face.js?v=render"></script>
<script>
  (function () {
    var F = window.MuneaFlatFace;
    F.skin.dir = '../avatars/ningning-rig/';
    F.mount(document.getElementById('host'));
    F.start();
    // 以 ?shift=<百分比> 把整個人往上推（3:4 等較方的取景要看頭肩）
    var q = new URLSearchParams(location.search);
    var shift = parseFloat(q.get('shift') || '0');
    if (shift) F.stage.style.top = (-shift) + '%';
    window.__faceReady = Promise.all(['body', 'half', 'open', 'eyes'].map(function (k) {
      var im = F.img[k];
      return im.complete && im.naturalWidth ? Promise.resolve() : new Promise(function (r) { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); });
    }));
  })();
</script>
</body>
</html>
