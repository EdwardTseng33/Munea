<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臉搬手機 · 技術骨架（佔位臉）</title>
<!--
  臉搬進手機 · 第 1 步技術骨架（2026-07-30 · Edward 拍板「新人物、demo 線」）

  驗證目標：聲音 → 嘴型「全部在這支裝置上算」，不經任何雲端顯示卡。
  三個判準（右上角碼表即時顯示）：
    ① 每秒 30 格不掉幀   ② 聲音到嘴型延遲 < 100ms   ③ 手機 CPU 撐得住
  這一步刻意用「佔位臉」（幾何圖形畫的、明顯不是產品角色）——驗的是管線，
  美術等新人物立繪＋嘴型差分（生圖 → 女巫視覺關）再換皮。
  嘴型做法＝業界標準的「能量＋音色」二維：音量決定嘴開多大、音色亮暗決定嘴扁圓。
-->
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0E1A17; color:#FAF7F2; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { padding:14px 16px 4px; text-align:center; }
  h1 { font-size:18px; margin:0 0 4px; font-weight:700; }
  .sub { font-size:13px; color:#9DB4AD; }
  #stage { position:relative; margin:12px 0; }
  canvas { background:radial-gradient(circle at 50% 30%, #17332C, #0E1A17 75%); border-radius:24px; }
  #hud { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.55); border-radius:10px;
         padding:8px 10px; font-size:12px; line-height:1.6; font-variant-numeric:tabular-nums; }
  #hud b { color:#3AA8A0; }
  .row { display:flex; gap:10px; margin:6px 0 20px; }
  button { background:#3AA8A0; border:0; color:#06211C; font-weight:700; font-size:15px;
           padding:12px 20px; border-radius:12px; cursor:pointer; }
  button.alt { background:#24453E; color:#FAF7F2; }
  #note { font-size:12px; color:#9DB4AD; max-width:340px; text-align:center; padding-bottom:20px; }
</style>
</head>
<body>
<header>
  <h1>臉搬手機 · 技術骨架</h1>
  <div class="sub">嘴型完全在這台裝置上算 · 零雲端顯示卡</div>
</header>

<div id="stage">
  <canvas id="face" width="360" height="440"></canvas>
  <div id="hud">
    幀率 <b id="fps">–</b> fps<br>
    聲→嘴延遲 <b id="lat">–</b> ms<br>
    嘴型切換 <b id="visemes">0</b> 次<br>
    音量 <b id="rms">–</b>
  </div>
</div>

<div class="row">
  <button id="btnClip">▶ 播寧寧的聲音</button>
  <button id="btnMic" class="alt">🎙 用麥克風</button>
</div>
<div id="note">佔位臉＝幾何圖形，刻意不像產品角色；這一步驗「順不順」，美術下一步換上新人物。</div>

<script>
(() => {
  const cv = document.getElementById('face'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let ac = null, analyser = null, srcNode = null;
  let mouthOpen = 0, mouthWide = 0.5, targetOpen = 0, targetWide = 0.5;
  let blink = 0, nextBlinkAt = performance.now() + 1800;
  let frames = 0, lastFpsAt = performance.now(), fpsNow = 0;
  let visemeChanges = 0, lastShape = -1;
  let latSamples = [];        // 聲音能量出現 → 下一次畫格的時間差
  let pendingAudioAt = 0;
  // 自動驗收數據（給程式讀）：window.__faceStats
  window.__faceStats = { fps: 0, latMs: 0, visemes: 0, running: false };

  function ensureAudio() {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    if (ac.state === 'suspended') ac.resume();
    if (!analyser) { analyser = ac.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.5; }
    return ac;
  }
  function hook(node, toSpeaker) {
    if (srcNode) { try { srcNode.disconnect(); } catch (e) {} }
    srcNode = node;
    node.connect(analyser);
    if (toSpeaker) analyser.connect(ac.destination); else { try { analyser.disconnect(ac.destination); } catch (e) {} }
    window.__faceStats.running = true;
  }

  $('btnClip').onclick = async () => {
    ensureAudio();
    const buf = await (await fetch('demo-assets/voice-sample.wav')).arrayBuffer();
    const audio = await ac.decodeAudioData(buf);
    const s = ac.createBufferSource(); s.buffer = audio; s.onended = () => { window.__faceStats.running = false; };
    hook(s, true); s.start();
  };
  $('btnMic').onclick = async () => {
    ensureAudio();
    const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
    hook(ac.createMediaStreamSource(ms), false);   // 麥克風不外放（回授）
  };

  const freqData = new Uint8Array(512);
  function readAudio() {
    if (!analyser) return { rms: 0, centroid: 0.5 };
    analyser.getByteFrequencyData(freqData);
    let sum = 0, wsum = 0, esum = 0;
    for (let i = 0; i < freqData.length; i++) { const v = freqData[i] / 255; sum += v * v; wsum += v * i; esum += v; }
    const rms = Math.sqrt(sum / freqData.length);
    const centroid = esum > 0 ? (wsum / esum) / freqData.length : 0.5;  // 音色亮暗 0~1
    return { rms, centroid };
  }

  // 節拍：前景用瀏覽器的畫格節拍；分頁在背景時它會被暫停（手機切出去也一樣），
  // 補一個 33ms 的備援節拍器讓嘴型與碼表照常運作——回前景自動交回畫格節拍。
  let _lastTick = 0;
  function draw(now) {
    if (now - _lastTick < 12) return;   // 兩個節拍器同時來時去重
    _lastTick = now;
    const { rms, centroid } = readAudio();
    // 音量→嘴開度（門檻擋環境音）；音色亮→嘴扁（ㄧ/ㄙ）、暗→嘴圓（ㄛ/ㄨ）
    targetOpen = Math.min(1, Math.max(0, (rms - 0.02) * 6));
    targetWide = 0.35 + Math.min(0.6, centroid * 1.8);
    if (rms > 0.03 && pendingAudioAt === 0) pendingAudioAt = now;
    // 平滑（快張慢合＝比較像真人）
    mouthOpen += (targetOpen - mouthOpen) * (targetOpen > mouthOpen ? 0.55 : 0.3);
    mouthWide += (targetWide - mouthWide) * 0.3;
    if (pendingAudioAt && mouthOpen > 0.12) {
      latSamples.push(now - pendingAudioAt); if (latSamples.length > 30) latSamples.shift();
      pendingAudioAt = 0;
    }
    if (rms < 0.02) pendingAudioAt = 0;
    // 嘴型檔位變化計數（4 檔：閉/小/中/大）
    const shape = mouthOpen < 0.1 ? 0 : mouthOpen < 0.35 ? 1 : mouthOpen < 0.7 ? 2 : 3;
    if (shape !== lastShape) { visemeChanges++; lastShape = shape; }
    // 眨眼
    if (now > nextBlinkAt) { blink = 1; nextBlinkAt = now + 1500 + Math.random() * 3200; }
    if (blink > 0) blink = Math.max(0, blink - 0.12);

    // ── 畫佔位臉 ──
    ctx.clearRect(0, 0, cv.width, cv.height);
    const cx = cv.width / 2, cy = cv.height / 2 - 10;
    // 頭
    ctx.fillStyle = '#F4D7C2';
    ctx.beginPath(); ctx.ellipse(cx, cy, 118, 142, 0, 0, Math.PI * 2); ctx.fill();
    // 髮
    ctx.fillStyle = '#4A3B36';
    ctx.beginPath(); ctx.ellipse(cx, cy - 74, 122, 84, 0, Math.PI, 0); ctx.fill();
    // 眼（含眨）
    const eyeH = 14 * (1 - blink * 0.92);
    ctx.fillStyle = '#33403D';
    ctx.beginPath(); ctx.ellipse(cx - 46, cy - 18, 11, Math.max(1.5, eyeH), 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 46, cy - 18, 11, Math.max(1.5, eyeH), 0, 0, Math.PI * 2); ctx.fill();
    // 腮紅
    ctx.fillStyle = 'rgba(244,162,97,.35)';
    ctx.beginPath(); ctx.ellipse(cx - 66, cy + 26, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 66, cy + 26, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
    // 嘴（核心）：開度×嘴寬
    const mw = 30 + mouthWide * 34, mh = 3 + mouthOpen * 34;
    ctx.fillStyle = '#8C4A43';
    ctx.beginPath(); ctx.ellipse(cx, cy + 62, mw, mh, 0, 0, Math.PI * 2); ctx.fill();
    if (mouthOpen > 0.45) {   // 開大時露一點牙床，比較不像黑洞
      ctx.fillStyle = '#F7EDE8';
      ctx.beginPath(); ctx.ellipse(cx, cy + 54 + mh * 0.2, mw * 0.62, Math.max(2, mh * 0.22), 0, 0, Math.PI * 2); ctx.fill();
    }

    // 碼表
    frames++;
    if (now - lastFpsAt >= 1000) {
      fpsNow = frames; frames = 0; lastFpsAt = now;
      const lat = latSamples.length ? Math.round(latSamples.reduce((a, b) => a + b, 0) / latSamples.length) : 0;
      $('fps').textContent = fpsNow;
      $('lat').textContent = lat || '–';
      $('visemes').textContent = visemeChanges;
      $('rms').textContent = rms.toFixed(3);
      Object.assign(window.__faceStats, { fps: fpsNow, latMs: lat, visemes: visemeChanges });
    }
  }
  (function loop(now){ draw(now || performance.now()); requestAnimationFrame(loop); })();
  setInterval(() => { const n = performance.now(); if (n - _lastTick > 90) draw(n); }, 33);
})();
</script>
</body>
</html>
